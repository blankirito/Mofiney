<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Concept 1: Clean geometric M inspired by a secure wallet -->
  <!-- Background: Soft pale mint squircle (safe for Android adaptive icon mask) -->
  <rect width="1024" height="1024" rx="224" fill="#F0FDF4"/>
  <rect x="24" y="24" width="976" height="976" rx="200" fill="none" stroke="#DCFCE7" stroke-width="4"/>

  <!-- Geometric Wallet M Mark: Perfectly centered and proportioned -->
  <!-- Outer dimensions: 540px wide, 520px high, centered at (512, 512) -->
  <g transform="translate(242, 252)">
    <!-- Left Stanza / Wallet Spine: Deep Forest Emerald #064E3B -->
    <rect x="0" y="40" width="120" height="440" rx="60" fill="#064E3B"/>

    <!-- Right Stanza: Deep Teal #0D9488 -->
    <rect x="420" y="40" width="120" height="440" rx="60" fill="#0D9488"/>

    <!-- Central Interlocking Fold / Wallet Flap forming the 'V' of the M -->
    <!-- Left downward diagonal flap -->
    <path d="M 60 100 
             L 270 330 
             C 270 330, 300 360, 270 390 
             L 270 390 
             C 240 420, 210 390, 210 390 
             L 60 220 Z" 
          fill="#047857" style="display:none;"/>

    <!-- Clean, crisp geometric V-pocket fold seamlessly bridging both stems -->
    <path d="M 60 100
             C 60 100, 100 80, 135 115
             L 270 250
             L 405 115
             C 440 80, 480 100, 480 100
             L 480 190
             C 480 215, 465 238, 445 258
             L 310 392
             C 288 414, 252 414, 230 392
             L 95 258
             C 75 238, 60 215, 60 190
             Z" 
          fill="#0D9488"/>

    <!-- Wallet clasp / security notch detail at the inner vertex -->
    <path d="M 210 180
             C 210 146.86 236.86 120 270 120
             C 303.14 120 330 146.86 330 180
             L 330 250
             C 330 283.14 303.14 310 270 310
             C 236.86 310 210 283.14 210 250
             Z" 
          fill="#064E3B"/>

    <!-- Minimal inner clasp keyway (pale mint accent) -->
    <circle cx="270" cy="205" r="24" fill="#F0FDF4"/>
  </g>
</svg>